<!DOCTYPE html>
<html>
<head>
  <title>NightEagle Settings</title>
  <style>
    body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
    label, select, textarea, input[type="text"] { display: block; margin-bottom: 10px; width: 100%; }
    #eagleFolder, #localFolder { font-family: monospace; }
    #eagleFolder option, #localFolder option { padding: 2px 4px; }
    .tab { display: none; }
    .tab.active { display: block; }
    .tab-buttons { margin-bottom: 10px; }
    .tab-buttons button { margin-right: 5px; }
    /* サブタブ用 */
    .prompt-tabs { margin-bottom: 10px; }
    .prompt-tabs button { margin-right: 5px; }
    .prompt-tabs button.active { font-weight: bold; }
    .subtab-content { display: none; }
    .subtab-content.active { display: block; }
    /* インタラクティブなプロンプト編集用 */
    .prompt-segment {
      position: relative;
      display: inline-block;
      margin-right: 2px;
      padding: 2px;
      border: 1px solid transparent;
    }
    .prompt-segment:hover { border: 1px dashed #aaa; }
    .segment-controls {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
    }
    .segment-controls button { padding: 0 2px; margin-left: 1px; }
  </style>
</head>
<body>
  <div class="tab-buttons">
    <button id="settingsTabBtn">Settings</button>
    <button id="promptManagerTabBtn">Prompt Manager</button>
  </div>
  
  <div id="settingsTab" class="tab active">
    <h1>NightEagle Settings</h1>
    
    <label for="transferTarget">Transfer Target:</label>
    <select id="transferTarget" name="transferTarget">
      <option value="eagle">Eagle</option>
      <option value="local">Local Folder</option>
    </select>
    
    <label for="eagleFolder">Eagle Folder:</label>
    <select id="eagleFolder" name="eagleFolder"></select>
    
    <!-- 既存の localFolder テキスト入力部分を以下に置き換え -->
    <label for="localFolderPicker">Local Folder:</label>
    <input type="file" id="localFolderPicker" webkitdirectory style="display:none" />
    <button id="chooseLocalFolderBtn">Choose Folder</button>
    <span id="localFolderName"></span>

    
    <label for="allTags">All Tags (comma-separated):</label>
    <textarea id="allTags" name="allTags" rows="5"></textarea>
    
    <div id="status"></div>
    
    <button id="showDebugLogs">Show Debug Logs</button>
  </div>
  
  <div id="promptManagerTab" class="tab">
    <h1>Prompt Manager</h1>
    <div class="prompt-tabs">
      <button id="positiveTabBtn" class="active">Positive Prompts</button>
      <button id="negativeTabBtn">Negative Prompts</button>
    </div>
    <div id="positiveTab" class="subtab-content active">
      <div id="positivePromptList"></div>
    </div>
    <div id="negativeTab" class="subtab-content">
      <div id="negativePromptList"></div>
    </div>
    <button id="addPromptBtn">Add New Prompt Record</button>
    <button id="exportPromptsBtn">Export Prompts</button>
    <input type="file" id="importPromptsInput" style="display:none">
    <button id="importPromptsBtn">Import Prompts</button>
    <button id="savePromptsBtn">Save Prompts</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
